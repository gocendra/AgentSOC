# ==============================================================
# AgentSOC - Configuración de Producción Nginx con SSL / HTTPS
# Ubicación en servidor: /etc/nginx/sites-available/soc.conf
# ==============================================================

# Zona de limitación de tasa (Rate Limiting) para prevenir ataques de fuerza bruta y DoS
limit_req_zone $binary_remote_addr zone=soc_api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=soc_auth_limit:10m rate=5r/s;

# 1. Redirección obligatoria HTTP (80) -> HTTPS (443)
server {
    listen 80;
    listen [::]:80;
    server_name soc.tudominio.com; # Reemplazar por tu subdominio / dominio real

    # Validación de desafío Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Principal HTTPS (443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name soc.tudominio.com; # Reemplazar por tu subdominio / dominio real

    # ==========================================================
    # CERTIFICADOS SSL (Descomentar según la opción elegida)
    # ==========================================================
    # OPCIÓN A: Let's Encrypt (Certbot)
    ssl_certificate /etc/letsencrypt/live/soc.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soc.tudominio.com/privkey.pem;

    # OPCIÓN B: Cloudflare Origin CA (si usas Cloudflare Full Strict)
    # ssl_certificate /etc/ssl/certs/cloudflare_soc.pem;
    # ssl_certificate_key /etc/ssl/private/cloudflare_soc.key;

    # Protocolos seguros y cifrados recomendados (Mozilla Modern/Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SOC_SSL:10m;
    ssl_session_tickets off;

    # ==========================================================
    # CABECERAS DE SEGURIDAD (HTTP Security Headers)
    # ==========================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamaño máximo de payload para logs y reportes
    client_max_body_size 10M;

    # ==========================================================
    # FRONTEND REACT (Archivos Estáticos SPA en /dist)
    # ==========================================================
    root /home/gabriel/github/agente_soc/soc-frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché estática optimizada para assets de Vite/React
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ==========================================================
    # BACKEND DJANGO REST API (Proxy Inverso a puerto 8000)
    # ==========================================================
    location ~ ^/(api|token|logs|agents|users|admin|tech-map) {
        limit_req zone=soc_api_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Cabeceras requeridas para que Django reconozca HTTPS y la IP real del cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port 443;

        # Soporte para WebSockets / SSE si se utilizan
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Protección estricta en endpoints de autenticación contra fuerza bruta
    location ~ ^/(token/|api/auth/) {
        limit_req zone=soc_auth_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
